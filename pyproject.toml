[project]
authors = [
  { name = "László Vaskó", email = "opensource@vlaci.email" },
]
dependencies = []
dynamic = [
  'description',
  'license',
  'readme',
  'version',
]
license-files = ["LICENSES/*.txt"]
name = "lzallright"
requires-python = ">=3.11"

[project.urls]
Changelog = "https://github.com/vlaci/lzallright/blob/main/CHANGELOG.md"
Homepage = "https://vlaci.github.io/lzallright"
Repository = "https://github.com/vlaci/lzallright"

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
  "ty>=0.0.84,<0.1",
]
docs = [
  "mkdocstrings-python>=2.0.9",
  "zensical>=0.0.67",
]
test = [
  "pytest>=9.1,<10.0",
]

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.15,<2.0"]

[tool.uv]
# Custom keys replace uv's defaults; the version now comes from Cargo.toml.
cache-keys = [
  { file = "Cargo.toml" },
  { file = "pyproject.toml" },
  { file = "python/Cargo.toml" },
]

[tool.maturin]
features = [
  "pyo3/abi3-py311",       # https://docs.python.org/3/c-api/stable.html
  "pyo3/abi3t-py315",      # https://peps.python.org/pep-0803/
  "pyo3/extension-module", # This is an extension module
]
include = [
  { path = "LICENSES/*", format = "sdist" },
  { path = "README.md", format = "sdist" },
  { path = "benches/**/*", format = "sdist" },
  { path = "scripts/pgo_profile.py", format = "sdist" },
  { path = "tests/*.py", format = "sdist" },
  { path = "uv.lock", format = "sdist" },
]
manifest-path = "python/Cargo.toml"
module-name = "lzallright._lzallright"
pgo-command = "python scripts/pgo_profile.py"
python-source = "python"

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["lzallright"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"
