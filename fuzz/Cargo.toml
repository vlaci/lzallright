[package]
edition = "2021"
name = "lzallright-fuzz"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.lzallright]
path = "../lzallright"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
doc = false
name = "decompress"
path = "fuzz_targets/decompress.rs"

[[bin]]
doc = false
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
