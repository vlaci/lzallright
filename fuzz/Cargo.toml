[package]
name = "lzallright-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.lzallright]
path = "../lzallright"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
doc = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
doc = false
