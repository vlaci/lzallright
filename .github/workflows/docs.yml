name: Docs

on:
  push:
    branches:
      - main

    paths:
      - "docs/**"
      - "python/**"
      - "README.md"
      - "CHANGELOG.md"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - "**/Cargo.toml"
      - "**/CHANGELOG.md"
      - "**/*.rs"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version-file: ".python-version"
      - name: Build Rust API docs
        run: |
          cargo doc -p lzallright --no-deps --target-dir target/site-doc
          cp -r target/site-doc/doc/. docs/rust
      - run: |
          uv sync --no-install-project --only-group docs
          uv run --no-sync zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
