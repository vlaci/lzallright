name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  Nix:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64-linux
          - os: ubuntu-24.04-arm
            arch: aarch64-linux
    name: Build Nix - ${{ matrix.arch }}.${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: lzallright
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Nix Flake checks
        run: |
          nix flake check \
              --keep-going \
              --print-build-logs \
              --option system ${{ matrix.arch }} \
              --extra-platforms ${{ matrix.arch }}

      - name: Code coverage
        if: ${{ matrix.arch == 'x86_64-linux' }}
        run: |
          nix build .#checks.${{ matrix.arch }}.test-coverage -o cargo-test
          nix build .#checks.${{ matrix.arch }}.pytest-coverage -o pytest
      - uses: codecov/codecov-action@v5
        if: ${{ matrix.arch == 'x86_64-linux' }}
        with:
          flags: cargo-test
          files: cargo-test/coverage.codecov
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: codecov/codecov-action@v5
        if: ${{ matrix.arch == 'x86_64-linux' }}
        with:
          flags: pytest
          files: pytest/coverage.codecov
          token: ${{ secrets.CODECOV_TOKEN }}

  Linux:
    needs: [Nix]
    name: "Linux (${{ matrix.target }}.${{ matrix.tag }})"
    strategy:
      matrix:
        include:
          - target: x86_64
            tag: manylinux2014
            container: quay.io/pypa/manylinux2014_x86_64:latest
            os: ubuntu-24.04
          - target: aarch64
            container: quay.io/pypa/manylinux2014_aarch64:latest
            tag: manylinux2014
            os: ubuntu-24.04-arm
          - target: x86_64
            container: quay.io/pypa/musllinux_1_2_x86_64:latest
            tag: musllinux_1_2
            os: ubuntu-24.04
          - target: aarch64
            container: quay.io/pypa/musllinux_1_2_aarch64:latest
            tag: musllinux_1_2
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wheel-linux-${{ matrix.target }}-${{ matrix.tag }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          container: ${{ matrix.container }}
          args: --profile release-lto --out dist --pgo -i python3.14
          maturin-version: v1.15.0
          rustup-components: llvm-tools
          sccache: ${{ !startsWith(matrix.tag, 'musllinux') }}
          docker-options: -e CARGO_NET_GIT_FETCH_WITH_CLI=true
          manylinux: ${{ matrix.tag }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          container: ${{ matrix.container }}
          args: --profile release-lto --out dist --pgo -i python3.14t
          maturin-version: v1.15.0
          rustup-components: llvm-tools
          sccache: ${{ !startsWith(matrix.tag, 'musllinux') }}
          manylinux: ${{ matrix.tag }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.tag }}
          path: dist
      - name: Test wheels
        run: |
          cat << EOF | docker run -v $PWD:/usr/src -i ${{ matrix.container }} sh -ex -
            cd /usr/src
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH=/root/.local/bin:$PATH
            uv sync --no-install-project --group test
            uv pip install dist/*-cp311-abi3-*.whl
            .venv/bin/pytest
          EOF

  Windows:
    needs: [Nix]
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v7
      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wheel-windows-${{ matrix.target }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Setup Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Setup Free-threaded Python
        id: python-nogil
        uses: actions/setup-python@v6
        with:
          python-version: 3.14t
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --profile release-lto --out dist --pgo -i "${{ steps.python.outputs.python-path }}"
          maturin-version: v1.15.0
          rustup-components: llvm-tools
          sccache: "true"
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --profile release-lto --out dist --pgo -i python3.14t
          maturin-version: v1.15.0
          rustup-components: llvm-tools
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist
      - name: Test wheels
        if: ${{ matrix.target == 'x64' }}
        run: |
          uv sync --no-install-project --group test --python "${{ steps.python.outputs.python-path }}"
          uv pip install (get-item .\dist\*-cp311-abi3-*.whl).FullName
          &".\.venv\Scripts\pytest.exe"

  MacOS:
    needs: [Nix]
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: wheel-macos-${{ matrix.target }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Setup Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --profile release-lto --out dist --pgo -i python3.14
          maturin-version: v1.15.0
          rustup-components: llvm-tools
          sccache: "true"
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --profile release-lto --out dist --pgo -i python3.14t
          maturin-version: v1.15.0
          rustup-components: llvm-tools
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist
      - name: Test wheels
        run: |
          uv sync --no-install-project --group test --python "${{ steps.python.outputs.python-path }}"
          uv pip install dist/*-cp311-abi3-*.whl
          .venv/bin/pytest

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/v')"
    needs: [Nix, Linux, Windows, MacOS, sdist]
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing *
