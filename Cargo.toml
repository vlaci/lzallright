[workspace]
exclude = ["fuzz"]
members = ["lzallright", "python"]
resolver = "2"

[workspace.package]
# Inherited by the Python package
authors = ["László Vaskó <opensource@vlaci.email>"]
description = "A Python 3.11+ LZO compression library in safe Rust, ported from LZ👌 (lzokay)"
edition = "2021"
homepage = "https://vlaci.github.io/lzallright"
license = "MIT"
readme = "README.md"
repository = "https://github.com/vlaci/lzallright"
rust-version = "1.83"
version = "0.3.0"

[workspace.dependencies]
criterion = "0.8"

[workspace.metadata.crane]
name = "lzallright"

[profile.release]
debug = true

[profile.release-lto]
codegen-units = 1
debug = "none"
debug-assertions = false
incremental = false
inherits = "release"
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release-lto"
